<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create your account</title>
</head>
<body>
    <main>
        <section>
            <span>GET STARTED FREE</span>
            <h1>Create your account</h1>
            <p>Fill in your details below — it takes less than a minute.</p>

            <form action="#" method="#"  novalidate class="create-acc">
                <label for="email">Email address</label>
                <input type="email" id="email" placeholder="you@company.com" name="email" required>
                <small class="emailError"></small>

                <div id="row">
                    <div>
                        <label for="country">Country</label>
                        <select id="country" required>
                        <option value="">Select country</option>
                        <option>Kenya</option>
                        <option>Uganda</option>
                        <option>Tanzania</option>
                        <option>United States</option>
                        <option>United Kingdom</option>
                        </select>
                        <small class="countryError"></small>
                    </div>
                    <div>
                        <label for="postal">Postal code</label>
                        <input type="text" id="postal" placeholder="00100" required>
                        <small class="postalError"></small>
                    </div>
                </div>

                <label for="password">Password</label>
                <input type="password" id="password" placeholder="At least 8 characters" minlength="8" required
                pattern="^(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*#?&])[A-Za-z\d@$!%*#?&]{8,}$">
                <small class="passwordError"></small>

                <label for="confirm">Confirm password</label>
                <input type="password" id="confirm" placeholder="Re-enter your password" required>
                <small class="pConfirmError"></small>

                <button type="submit">Create account</button>

                <p>
                    By creating an account you agree to our
                    <a href="#">Terms of Service</a> and
                    <a href="#">Privacy Policy</a>.
                </p>
            </form>
        </section>
        <footer>
        Already have an account? <a href="#">Sign in</a>
        </footer>
    </main>
</body>
</html>
